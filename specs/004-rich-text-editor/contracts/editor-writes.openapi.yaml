openapi: 3.1.0
info:
  title: Mini Notion Rich Text Editor Write Contract
  version: 1.0.0
  description: >-
    Companion contract that narrows document create and update request content for feature 004.
    Responses, authentication, headers and errors remain defined by feature 003.
servers:
  - url: /api
security:
  - cookieAuth: []
paths:
  /documents:
    post:
      operationId: createRichTextDocument
      summary: Create a document with optional strict Rich Text Content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRichTextDocumentRequest"
      responses:
        "201":
          $ref: "#/components/responses/DocumentCreated"
        "400":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/MalformedJson"
        "401":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/OriginRejected"
        "413":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/RequestBodyTooLarge"
        "422":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/ValidationFailed"
        "503":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/StoreUnavailable"
  /documents/{documentId}:
    parameters:
      - $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/parameters/DocumentId"
    patch:
      operationId: updateRichTextDocument
      summary: Conditionally update title and/or strict Rich Text Content
      parameters:
        - $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRichTextDocumentRequest"
      responses:
        "200":
          $ref: "#/components/responses/DocumentUpdated"
        "400":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/InvalidRequest"
        "401":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/OriginRejected"
        "404":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/DocumentNotFound"
        "412":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/VersionConflict"
        "413":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/RequestBodyTooLarge"
        "422":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/ValidationFailed"
        "428":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/PreconditionRequired"
        "503":
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/responses/StoreUnavailable"
components:
  securitySchemes:
    cookieAuth:
      $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/securitySchemes/cookieAuth"
  responses:
    DocumentCreated:
      description: Document created and ready to edit
      headers:
        Location:
          description: Canonical API path of the created document.
          schema:
            type: string
        ETag:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/headers/DocumentETag"
        Cache-Control:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/headers/PrivateNoStore"
        Vary:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/headers/VaryCookie"
        X-Request-Id:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/schemas/Document"
    DocumentUpdated:
      description: Document updated; version and modification time advanced
      headers:
        ETag:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/headers/DocumentETag"
        Cache-Control:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/headers/PrivateNoStore"
        Vary:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/headers/VaryCookie"
        X-Request-Id:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/schemas/Document"
  schemas:
    CreateRichTextDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/schemas/CreateDocumentRequest/properties/title"
        content:
          $ref: "#/components/schemas/RichTextContent"
    UpdateRichTextDocumentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          $ref: "../../003-document-management/contracts/documents.openapi.yaml#/components/schemas/UpdateDocumentRequest/properties/title"
        content:
          $ref: "#/components/schemas/RichTextContent"
      anyOf:
        - required: [title]
        - required: [content]
    RichTextContent:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          const: doc
        content:
          type: array
          items:
            $ref: "#/components/schemas/BlockNode"
      description: >-
        Heading IDs must additionally be unique within this root. Canonical UTF-8 size, depth and node
        count retain the limits and violation precedence defined by feature 003.
    BlockNode:
      oneOf:
        - $ref: "#/components/schemas/ParagraphNode"
        - $ref: "#/components/schemas/HeadingNode"
        - $ref: "#/components/schemas/BulletListNode"
        - $ref: "#/components/schemas/OrderedListNode"
    ParagraphNode:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          const: paragraph
        attrs:
          $ref: "#/components/schemas/TextAlignAttributes"
        content:
          type: array
          items:
            $ref: "#/components/schemas/TextNode"
    HeadingNode:
      type: object
      additionalProperties: false
      required: [type, attrs, content]
      properties:
        type:
          const: heading
        attrs:
          $ref: "#/components/schemas/HeadingAttributes"
        content:
          type: array
          items:
            $ref: "#/components/schemas/TextNode"
    BulletListNode:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          const: bulletList
        content:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ListItemNode"
    OrderedListNode:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          const: orderedList
        content:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ListItemNode"
    ListItemNode:
      type: object
      additionalProperties: false
      required: [type, content]
      properties:
        type:
          const: listItem
        content:
          type: array
          minItems: 1
          prefixItems:
            - $ref: "#/components/schemas/ParagraphNode"
          items:
            $ref: "#/components/schemas/BlockNode"
    TextNode:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          const: text
        text:
          type: string
          minLength: 1
        marks:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/RichTextMark"
          description: Mark types must not repeat on one text node.
    RichTextMark:
      oneOf:
        - $ref: "#/components/schemas/BoldMark"
        - $ref: "#/components/schemas/ItalicMark"
        - $ref: "#/components/schemas/UnderlineMark"
        - $ref: "#/components/schemas/TextStyleMark"
    BoldMark:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: bold
    ItalicMark:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: italic
    UnderlineMark:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: underline
    TextStyleMark:
      type: object
      additionalProperties: false
      required: [type, attrs]
      properties:
        type:
          const: textStyle
        attrs:
          $ref: "#/components/schemas/TextStyleAttributes"
    TextStyleAttributes:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        color:
          $ref: "#/components/schemas/ColorToken"
        fontSize:
          $ref: "#/components/schemas/FontSizeToken"
      anyOf:
        - required: [color]
        - required: [fontSize]
    TextAlignAttributes:
      type: object
      additionalProperties: false
      required: [textAlign]
      properties:
        textAlign:
          $ref: "#/components/schemas/TextAlignment"
    HeadingAttributes:
      type: object
      additionalProperties: false
      required: [level, id]
      properties:
        level:
          type: integer
          enum: [1, 2, 3]
        id:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        textAlign:
          $ref: "#/components/schemas/TextAlignment"
    TextAlignment:
      type: string
      enum: [left, center, right, justify]
    ColorToken:
      type: string
      enum: [default, muted, red, orange, green, blue]
    FontSizeToken:
      type: string
      enum: [small, default, large, x-large]
